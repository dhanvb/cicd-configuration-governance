---
- name: Deploy approved application configuration
  hosts: app_server
  gather_facts: false

  vars:
    app_name: demo-app
    config_source: "{{ playbook_dir }}/../config-repo/app-config.yml"
    config_target_dir: "/tmp/cicd-configuration-governance/demo-app"
    config_target_file: "{{ config_target_dir }}/app-config.yml"
    deploy_log: "{{ config_target_dir }}/deploy.log"

  tasks:
    - name: Load approved candidate configuration
      ansible.builtin.include_vars:
        file: "{{ config_source }}"
        name: candidate_config

    - name: Ensure application configuration directory exists
      ansible.builtin.file:
        path: "{{ config_target_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy approved configuration
      ansible.builtin.copy:
        src: "{{ config_source }}"
        dest: "{{ config_target_file }}"
        mode: "0644"

    - name: Calculate deployed configuration checksum
      ansible.builtin.stat:
        path: "{{ config_target_file }}"
        checksum_algorithm: sha256
      register: deployed_file

    - name: Record deployment evidence
      ansible.builtin.lineinfile:
        path: "{{ deploy_log }}"
        create: true
        mode: "0644"
        line: >-
          {{ lookup('pipe', 'date -Is') }}
          | app={{ app_name }}
          | version={{ candidate_config.version }}
          | checksum={{ deployed_file.stat.checksum }}
