---
- name: Verify deployed configuration against approved baseline
  hosts: app_server
  gather_facts: false

  vars:
    candidate_config_file: "{{ playbook_dir }}/../config-repo/app-config.yml"
    policy_file: "{{ playbook_dir }}/../policy/approved-release.yml"
    config_target_file: "/tmp/cicd-configuration-governance/demo-app/app-config.yml"
    validation_log: "/tmp/cicd-configuration-governance/demo-app/validation.log"

  tasks:
    - name: Load approved release policy
      ansible.builtin.include_vars:
        file: "{{ policy_file }}"
        name: release_policy

    - name: Read deployed configuration
      ansible.builtin.slurp:
        src: "{{ config_target_file }}"
      register: deployed_config_raw

    - name: Parse deployed YAML configuration
      ansible.builtin.set_fact:
        deployed_config: "{{ deployed_config_raw.content | b64decode | from_yaml }}"

    - name: Calculate candidate configuration checksum
      ansible.builtin.stat:
        path: "{{ candidate_config_file }}"
        checksum_algorithm: sha256
      delegate_to: localhost
      register: candidate_file

    - name: Calculate deployed configuration checksum
      ansible.builtin.stat:
        path: "{{ config_target_file }}"
        checksum_algorithm: sha256
      register: deployed_file

    - name: Verify deployed configuration
      ansible.builtin.assert:
        that:
          - deployed_config.app_name == release_policy.application
          - deployed_config.environment == release_policy.environment
          - (deployed_config.version | string) == (release_policy.approved_version | string)
          - (candidate_file.stat.checksum | lower) == (release_policy.approved_config_sha256 | lower)
          - (deployed_file.stat.checksum | lower) == (release_policy.approved_config_sha256 | lower)
          - (deployed_file.stat.checksum | lower) == (candidate_file.stat.checksum | lower)
        fail_msg: >-
          Post-deployment verification failed.
          The approved baseline, candidate configuration, and deployed
          configuration do not have the expected identity.
        success_msg: >-
          Post-deployment verification passed.
          Application, environment, version, approved SHA-256,
          candidate SHA-256, and deployed SHA-256 all match.

    - name: Record validation evidence
      ansible.builtin.lineinfile:
        path: "{{ validation_log }}"
        create: true
        mode: "0644"
        line: >-
          {{ lookup('pipe', 'date -Is') }}
          | app={{ deployed_config.app_name }}
          | environment={{ deployed_config.environment }}
          | approved_version={{ release_policy.approved_version }}
          | deployed_version={{ deployed_config.version }}
          | approved_sha256={{ release_policy.approved_config_sha256 }}
          | candidate_sha256={{ candidate_file.stat.checksum }}
          | deployed_sha256={{ deployed_file.stat.checksum }}
          | verified=true
